<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample · Pulso de Marca Renner</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#F50209; --red-25:#FBC3C5; --red-10:#FEEBEC;
  --ink:#1D1D1F; --sec:#6E6E73; --ter:#A1A1A6;
  --bg:#F5F5F7; --card:#FFFFFF; --line:#E8E8ED; --track:#F2F2F4;
  --up:#137D50; --up-bg:#E5F4EC; --down:#7A1F2B; --down-bg:#F6E9EB;
  --amber-bg:#FFF6E0; --amber:#9A6A00;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
/* NAV */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1180px;margin:0 auto;height:56px;display:flex;align-items:center;gap:28px;padding:0 24px}
.nav-logo{height:22px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{background:none;border:0;font-size:13px;font-weight:500;color:var(--sec);padding:8px 14px;border-radius:999px;transition:.2s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:#fff}
/* HERO */
.hero{background:#fff;border-bottom:1px solid var(--line)}
.hero-in{max-width:1180px;margin:0 auto;padding:64px 24px 48px;display:grid;grid-template-columns:1.4fr 1fr;gap:48px;align-items:end}
.hero h1{font-size:52px;line-height:1.05;font-weight:700;letter-spacing:-1.6px}
.hero h1 span{color:var(--red)}
.hero p.lead{font-size:19px;color:var(--sec);margin-top:18px;max-width:560px;font-weight:400;line-height:1.45}
.hero-meta{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px}
.hero-meta div{font-size:13px;color:var(--sec)}
.hero-meta b{display:block;color:var(--ink);font-weight:500;font-size:15px;margin-top:2px}
/* FILTER BAR */
.fbar{position:sticky;top:56px;z-index:40;background:rgba(245,245,247,.9);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.fbar-in{max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.fg{display:flex;align-items:center;gap:8px}
.fg>label{font-size:12px;color:var(--sec);font-weight:500}
.seg{display:inline-flex;background:#E3E3E8;border-radius:10px;padding:2px}
.seg button{border:0;background:none;font-size:12.5px;font-weight:500;color:var(--ink);padding:6px 12px;border-radius:8px;white-space:nowrap;transition:background .2s}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:disabled{color:var(--ter);cursor:default}
.seg button .soon{font-size:10px;color:var(--ter);margin-left:4px;font-weight:400}
.subchips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink);font-weight:400;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.b-on{background:#fff;color:var(--ink);font-weight:500}
.chip.lock{cursor:default}
.basepill{margin-left:auto;font-size:12px;color:var(--sec);display:flex;gap:8px;align-items:center}
.basepill b{color:var(--ink);font-weight:500}
.warn{background:var(--amber-bg);color:var(--amber);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:500}
.fmobile{display:none}
/* LAYOUT */
main{max-width:1180px;margin:0 auto;padding:40px 24px 80px}
.view{display:none}.view.on{display:block}
.sec-title{font-size:32px;font-weight:700;letter-spacing:-.8px;line-height:1.15;margin:8px 0 6px}
.sec-sub{color:var(--sec);font-size:16px;margin-bottom:28px;max-width:720px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:24px}
/* STAT */
.stat .lbl{font-size:13px;color:var(--sec)}
.stat .num{font-size:46px;font-weight:700;letter-spacing:-1.5px;line-height:1.1;margin-top:10px}
.stat .num small{font-size:22px;font-weight:500;letter-spacing:-.5px}
.stat .ctx{font-size:12.5px;color:var(--sec);margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.d{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:500;border-radius:6px;padding:1px 6px}
.d.up{color:var(--up);background:var(--up-bg)}.d.dn{color:var(--down);background:var(--down-bg)}.d.eq{color:var(--sec);background:var(--track)}
/* NARRATIVE */
.acts{margin-top:40px}
.act{border-top:1px solid var(--line)}
.act:last-child{border-bottom:1px solid var(--line)}
.act-h{width:100%;background:none;border:0;text-align:left;display:grid;grid-template-columns:56px 1fr 28px;align-items:center;padding:26px 0;gap:8px}
.act-n{font-size:36px;font-weight:300;color:var(--ter);letter-spacing:-1px}
.act.open .act-n{color:var(--red)}
.act-t{font-size:22px;font-weight:500;letter-spacing:-.4px;line-height:1.3;color:var(--ink)}
.act-x{font-size:22px;color:var(--ter);transition:transform .3s;text-align:center}
.act.open .act-x{transform:rotate(45deg)}
.act-b{display:none;padding:0 0 32px 64px}
.act.open .act-b{display:block}
.act-b p.txt{color:var(--sec);font-size:15px;max-width:760px;margin-bottom:20px}
/* COLLAPSIBLE */
.cc{margin-bottom:14px;overflow:hidden}
.cc-h{width:100%;background:none;border:0;display:flex;align-items:center;gap:14px;padding:22px 24px;text-align:left}
.cc-ic{width:36px;height:36px;border-radius:10px;background:var(--track);display:grid;place-items:center;flex:none}
.cc-ic svg{width:18px;height:18px;stroke:var(--ink)}
.cc-t{font-size:17px;font-weight:700;letter-spacing:-.2px}
.cc-s{font-size:12.5px;color:var(--sec);margin-top:1px}
.cc-x{margin-left:auto;width:28px;height:28px;border-radius:50%;background:var(--track);display:grid;place-items:center;transition:transform .3s;flex:none}
.cc.open .cc-x{transform:rotate(180deg)}
.cc-b{display:none;padding:4px 24px 28px}
.cc.open .cc-b{display:block}
.cc.gray{background:#FAFAFA}
.sub{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.sub .n{font-size:13px;color:var(--ter);font-weight:500}
.sub .t{font-size:15px;font-weight:700}
.divl{font-size:12.5px;color:var(--sec);margin:22px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:4px 0 18px}
.note{font-size:11.5px;color:var(--ter);margin-top:14px}
.notice{display:none;background:var(--track);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--sec);margin-bottom:16px}
.notice.on{display:block}
/* HBARS pattern C */
.hb{display:grid;grid-template-columns:120px 1fr 92px;align-items:center;gap:12px;padding:6px 0}
.hb .nm{font-size:13px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.hb .nm i{width:9px;height:9px;border-radius:50%;flex:none}
.hb .tr{height:22px;background:var(--track);border-radius:6px;position:relative;overflow:hidden}
.hb .fl{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hb .pv{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.35}
.hb .vl{font-size:13px;text-align:right;display:flex;justify-content:flex-end;gap:6px;align-items:center}
.hb.ren .nm{font-weight:500}
/* FUNNEL 7.1 */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fc{border:1px solid var(--line);border-radius:14px;padding:18px}
.fc-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:14px}
.fc-h i{width:10px;height:10px;border-radius:50%}
.fs{display:grid;grid-template-columns:1fr;gap:2px;margin-bottom:9px}
.fs-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sec)}
.fs-l b{font-weight:500;color:var(--ink);display:flex;gap:5px;align-items:center}
.fs-t{height:16px;display:flex;justify-content:center}
.fs-f{height:16px;border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.fsep{border-top:1px dashed #CFCFD4;margin:10px 0 12px}
/* TABLE */
table.ct{width:100%;border-collapse:separate;border-spacing:4px}
.ct th{font-size:12px;font-weight:500;color:var(--sec);text-align:right;padding:4px 8px;white-space:nowrap}
.ct th:first-child{text-align:left}
.ct th small{display:block;font-weight:400;color:var(--ter);font-size:10.5px}
.ct td{font-size:13px;padding:8px 10px;text-align:right;background:var(--track);border-radius:8px;white-space:nowrap}
.ct td:first-child{text-align:left;background:none;color:var(--ink);padding-left:0;white-space:normal}
.ct td.best{outline:1.5px solid var(--ink);outline-offset:-1.5px}
.dd{font-size:11px;margin-left:6px;font-weight:500}
.dd.up{color:var(--up)}.dd.dn{color:var(--down)}
.lock-ic{width:11px;height:11px;margin-left:2px}
.ct td.ld{text-align:left}
.ct td.ld i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.ct td.ld span{color:var(--sec);margin-left:4px}
.ct td.ren{background:var(--red-10)}
.tscroll{overflow-x:auto}
/* insights */
.ins-l{font-size:12.5px;color:var(--sec);border-bottom:1px solid var(--line);padding-bottom:6px;margin:24px 0 10px;display:inline-block}
.ins{display:grid;gap:10px}
.box{border-radius:12px;padding:12px 16px;font-size:13.5px;line-height:1.5}
.box.y{background:#F7F7F9}
.box.r{background:var(--red-10)}
.box.g{background:var(--up-bg)}
.box.w{background:var(--down-bg)}
/* legend */
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--sec);margin-top:10px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:10px;height:3px;border-radius:2px}
svg text{font-family:inherit}
.design{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.design h4{font-size:13px;font-weight:500;color:var(--sec);margin-bottom:6px}
.design p{font-size:14px}
.takeaways{background:#FAFAFA}
.takeaways ol{padding-left:20px;display:grid;gap:12px;font-size:15px}
footer{border-top:1px solid var(--line);background:#fff}
.foot{max-width:1180px;margin:0 auto;padding:28px 24px;display:flex;align-items:center;gap:20px;font-size:12px;color:var(--sec)}
.foot img{height:30px;margin-left:auto}
.lead-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.mini{font-size:12px;color:var(--sec)}
@media(max-width:900px){
 .g4{grid-template-columns:repeat(2,1fr)}.g3,.fgrid{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}
 .hero-in{grid-template-columns:1fr;padding:40px 20px 32px}.hero h1{font-size:38px}
 .design{grid-template-columns:1fr 1fr}
}
@media(max-width:760px){
 .nav-in{gap:12px;padding:0 16px}.tabs .tab{padding:7px 10px}
 .fbar-in{display:none}
 .fmobile{display:flex;max-width:1180px;margin:0 auto;padding:10px 16px;align-items:center;gap:10px}
 .fmobile .sum{font-size:12.5px;color:var(--ink);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .fmobile button{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:500}
 .fbar.sheet{backdrop-filter:none;-webkit-backdrop-filter:none;z-index:80}
 .fbar.sheet .fbar-in{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;flex-direction:column;align-items:stretch;padding:20px 18px 28px;box-shadow:0 -10px 40px rgba(0,0,0,.18);max-height:80vh;overflow:auto;z-index:70}
 .fbar.sheet .fg{flex-direction:column;align-items:flex-start}
 .fbar.sheet .seg{overflow-x:auto;max-width:100%}
 .fbar.sheet .basepill{margin-left:0}
 .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:65}
 .fbar.sheet~.scrim{display:block}
 .sheet-close{display:block!important;align-self:stretch;border:0;background:var(--ink);color:#fff;border-radius:12px;padding:12px;font-weight:500;margin-top:6px}
 main{padding:28px 16px 60px}
 .g4,.g3,.fgrid,.design{grid-template-columns:1fr}
 .act-b{padding-left:0}.act-t{font-size:18px}
 .hb{grid-template-columns:96px 1fr 84px}
}
.sheet-close{display:none}
.sbadge{font-size:11px;font-weight:500;color:var(--sec);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.h1s{font-size:15px;font-weight:500;letter-spacing:0;color:var(--sec);border:1px solid var(--line);border-radius:999px;padding:4px 12px;vertical-align:middle;position:relative;top:-6px}
.wm{position:fixed;right:16px;bottom:14px;z-index:60;font-size:10.5px;font-weight:500;letter-spacing:1.5px;color:var(--sec);background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:6px 12px;pointer-events:none}
@media(max-width:760px){.sbadge{display:none}}
</style>
<style>
#gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:999;padding:20px}
.g-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:44px 40px 30px;width:100%;max-width:380px;text-align:center}
.g-logo{height:26px;margin-bottom:26px}
.g-t{font-size:28px;font-weight:700;letter-spacing:-.6px}
.g-s{color:var(--sec);font-size:14px;margin:4px 0 26px}
#gForm{display:grid;gap:10px}
#gPw{font:inherit;font-size:15px;padding:13px 16px;border:1px solid #D2D2D7;border-radius:12px;outline:none;text-align:center}
#gPw:focus{border-color:var(--ink)}
#gBtn{font:inherit;font-size:15px;font-weight:500;background:var(--ink);color:#fff;border:0;border-radius:12px;padding:13px}
#gBtn:disabled{opacity:.6}
.g-err{color:var(--down);font-size:13px;min-height:20px;margin-top:10px}
.g-foot{font-size:10.5px;letter-spacing:1.5px;font-weight:500;color:var(--sec);margin-top:10px}
.g-prov{height:24px;margin-top:22px}
</style>
</head>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},k,b64(P.c));
  const o=JSON.parse(new TextDecoder().decode(pt));
  document.getElementById('gate').remove();
  document.body.insertAdjacentHTML('afterbegin',o.html);
  const s=document.createElement('script');s.textContent=o.js;document.body.appendChild(s);
}
async function tryPw(pw,silent){
  const btn=document.getElementById('gBtn'),err=document.getElementById('gErr');
  btn.disabled=true;btn.textContent='Verificando';err.textContent='';
  try{await open_(pw);sessionStorage.setItem('pvks_s',pw);}
  catch(e){sessionStorage.removeItem('pvks_s');if(!silent){err.textContent='Senha incorreta. Tente novamente.';document.getElementById('gPw').select();}btn.disabled=false;btn.textContent='Entrar';}
}
document.getElementById('gForm').addEventListener('submit',e=>{e.preventDefault();tryPw(document.getElementById('gPw').value);});
const sv=sessionStorage.getItem('pvks_s');if(sv)tryPw(sv,true);
})();
